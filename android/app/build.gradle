plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def socketAgentApplicationId = (
    project.findProperty("SOCKETAGENT_APPLICATION_ID")
        ?: System.getenv("SOCKETAGENT_APPLICATION_ID")
        ?: "com.socketagent.app"
).toString()
def googleServicesFile = file("google-services.json")
def googleServicesPackageNeedle = "\"package_name\": \"${socketAgentApplicationId}\""

if (googleServicesFile.exists() && googleServicesFile.text.contains(googleServicesPackageNeedle)) {
    apply plugin: "com.google.gms.google-services"
}

android {
    namespace = "com.socketagent.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = socketAgentApplicationId
        minSdk = 24
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = file(System.getProperty('user.home') + '/.claude-assistant/keystore-credentials.txt')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['keystore_path'])
                storePassword keystoreProperties['keystore_password']
                keyAlias 'socketclaude'
                keyPassword keystoreProperties['key_password']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

flutter {
    source = "../.."
}
